<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 코드 최적화 도구</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>스마트 코드 최적화 도구</h1>
    
    <div class="controls">
        <div class="lang-status" id="detectedLang">감지된 언어: 자동 감지 중...</div>

        <select id="language">
            <option value="auto">자동 감지 (Auto Detect)</option>
            <option value="html">HTML</option>
            <option value="js">JavaScript</option>
            <option value="python">Python</option>
            <option value="css">CSS</option>
            <option value="cpp">C++</option>
        </select>

        <button id="btnOptimize">코드 압축 (Minify)</button>
        <button id="btnFormat">코드 정렬 (Pretty)</button>
        <button id="btnCopy">결과 복사</button>
    </div>

    <div class="editor-container">
        <div class="editor-box">
            <label for="inputCode">원본 코드</label>
            <textarea id="inputCode" placeholder="코드를 붙여넣으세요..."></textarea>
            <div class="stats" id="inputStats">크기: 0 bytes</div>
        </div>

        <div class="editor-box">
            <label for="outputCode">최적화된 코드</label>
            <textarea id="outputCode" readonly placeholder="결과가 여기에 표시됩니다..."></textarea>
            <div class="stats" id="outputStats">크기: 0 bytes (절감률: 0%)</div>
        </div>
    </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
