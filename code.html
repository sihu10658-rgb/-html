<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 코드 최적화 도구</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3b;
      --text-color: #ddd6f4;
      --sub-text: #a6adc8;
      --primary-color: #89b4fa;
      --border-color: #45475a;
      --accent-color: #a6e3a1;
      --button-bg: #313244;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: var(--primary-color);
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .lang-status {
      font-size: 13px;
      color: var(--accent-color);
      font-weight: bold;
      padding: 8px 12px;
      background: rgba(166, 227, 161, 0.1);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    select, button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--button-bg);
      color: var(--text-color);
      cursor: pointer;
    }

    button {
      background: var(--primary-color);
      color: #11111b;
      font-weight: bold;
      border: 0;
    }

    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .editor-box {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--sub-text);
    }

    textarea {
      width: 100%;
      height: 450px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
      background: var(--card-bg);
      color: var(--text-color);
    }

    textarea:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .stats {
      margin-top: 10px;
      font-size: 13px;
      color: var(--sub-text);
    }

    @media (max-width: 768px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>스마트 코드 최적화 도구</h1>

    <div class="controls">
      <div class="lang-status" id="detectedLang">감지된 언어: JavaScript</div>
      <select id="language">
        <option value="auto">Auto Detect</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
        <option value="python">Python</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="go">Go</option>
      </select>
      <button id="btnOptimize" type="button">최적화</button>
      <button id="btnFormat" type="button">포맷</button>
      <button id="btnCopy" type="button">복사</button>
    </div>

    <div class="editor-container">
      <div class="editor-box">
        <label for="inputCode">입력 코드</label>
        <textarea id="inputCode" placeholder="코드를 입력하세요..."></textarea>
        <div class="stats" id="inputStats">크기: 0 bytes</div>
      </div>

      <div class="editor-box">
        <label for="outputCode">결과 코드</label>
        <textarea id="outputCode" readonly placeholder="최적화 결과가 여기에 표시됩니다..."></textarea>
        <div class="stats" id="outputStats">크기: 0 bytes (절감률: 0%)</div>
      </div>
    </div>
  </div>

  <script>
    function detectLanguage(code) {
      if (!code || !code.trim()) return { lang: 'js', label: 'JavaScript' };

      if (/<html|<!doctype|<body|<div|<script|<style/i.test(code)) {
        return { lang: 'html', label: 'HTML' };
      }

      const hasJavaScriptSyntax = /\b(?:function|const|let|var|return|new|class|async|await|throw|if|for|while|switch|import|export)\b|=>|(?:^|[;])\s*[\w$]+\s*=\s*(?:\{|\[|function\b)/m.test(code);
      const hasCssAtRule = /^\s*@(media|keyframes|import|supports|font-face)\b/im.test(code);
      const hasCssRule = /(?:^|\n)\s*(?:[.#][\w-]+|[a-zA-Z][\w-]*(?:\s*[,>+~]\s*[.#\w-]+)*)\s*\{[^{}]*\b[-\w]+\s*:\s*[^{};]+;?\s*\}/m.test(code);
      if ((hasCssAtRule || hasCssRule) && !hasJavaScriptSyntax) {
        return { lang: 'css', label: 'CSS' };
      }

      if (/\b(def\s+\w+|import\s+\w+|print\s*\()/i.test(code) && !/\b(class|function|const|let|var)\b/.test(code)) {
        return { lang: 'python', label: 'Python' };
      }

      if (/\b(?:#include|printf|scanf|malloc|typedef|struct)\b/.test(code)) {
        return { lang: 'c', label: 'C' };
      }

      if (/(?:\bstd::|class\s+\w+\s*\{|using\s+namespace\s+std)/.test(code)) {
        return { lang: 'cpp', label: 'C++' };
      }

      if (/\bpackage\s+\w+|\bfunc\s+\w+\s*\(|fmt\./.test(code)) {
        return { lang: 'go', label: 'Go' };
      }

      return { lang: 'js', label: 'JavaScript' };
    }

    function minifyTokens(code, lineComments = true) {
      let out = '';
      let pendingSpace = false;
      let canStartRegex = true;
      const isWord = ch => !!ch && /[\w$]/.test(ch);
      const regexPrefixKeywords = new Set(['return', 'throw', 'case', 'delete', 'void', 'typeof', 'instanceof', 'in', 'of', 'yield', 'await', 'else', 'do']);

      for (let i = 0; i < code.length;) {
        const c = code[i];
        const n = code[i + 1] || '';

        if (/\s/.test(c)) {
          pendingSpace = true;
          i++;
          continue;
        }

        // Remove comments only when the slash is not starting a regex literal.
        if (c === '/' && n === '/' && lineComments) {
          i += 2;
          while (i < code.length && code[i] !== '\n' && code[i] !== '\r') i++;
          pendingSpace = true;
          continue;
        }
        if (c === '/' && n === '*') {
          i += 2;
          while (i < code.length && !(code[i] === '*' && code[i + 1] === '/')) i++;
          if (i < code.length) i += 2;
          pendingSpace = true;
          continue;
        }

        if (c === '"' || c === "'" || c === '`') {
          if (pendingSpace && isWord(out[out.length - 1])) out += ' ';
          pendingSpace = false;
          const quote = c;
          out += c;
          i++;
          while (i < code.length) {
            const current = code[i++];
            out += current;
            if (current === '\\' && i < code.length) out += code[i++];
            else if (current === quote) break;
          }
          canStartRegex = false;
          continue;
        }

        if (c === '/' && canStartRegex) {
          if (pendingSpace && isWord(out[out.length - 1])) out += ' ';
          pendingSpace = false;
          out += c;
          i++;
          let inCharacterClass = false;
          while (i < code.length) {
            const current = code[i++];
            out += current;
            if (current === '\\' && i < code.length) {
              out += code[i++];
            } else if (current === '[') {
              inCharacterClass = true;
            } else if (current === ']') {
              inCharacterClass = false;
            } else if (current === '/' && !inCharacterClass) {
              while (i < code.length && /[a-z]/i.test(code[i])) out += code[i++];
              break;
            } else if (current === '\n' || current === '\r') {
              break;
            }
          }
          canStartRegex = false;
          continue;
        }

        if (pendingSpace && isWord(out[out.length - 1]) && isWord(c)) out += ' ';
        pendingSpace = false;

        if (/[\w$]/.test(c)) {
          const start = i;
          while (i < code.length && /[\w$]/.test(code[i])) i++;
          const word = code.slice(start, i);
          out += word;
          canStartRegex = regexPrefixKeywords.has(word);
          continue;
        }

        out += c;
        i++;
        if (c === ')' || c === ']' || c === '}' || c === '.' || c === '`') {
          canStartRegex = false;
        } else if (c === '(' || c === '[' || c === '{' || c === ',' || c === ';' || c === ':' || c === '?' || c === '=' || c === '!' || c === '~' || c === '+' || c === '-' || c === '*' || c === '%' || c === '&' || c === '|' || c === '^' || c === '<' || c === '>' || c === '/') {
          canStartRegex = true;
        }
      }

      return out.trim();
    }

    function minifyCSS(code) {
      return code.replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/\s+/g, ' ')
        .replace(/\s*([{};,])\s*/g, '$1')
        .trim();
    }

    function findScriptClose(code, start) {
      let quote = null;
      let lineComment = false;
      let blockComment = false;
      let regexAllowed = true;
      let inCharacterClass = false;
      let previousWord = '';
      const regexPrefixKeywords = new Set(['return', 'throw', 'case', 'delete', 'void', 'typeof', 'instanceof', 'in', 'of', 'yield', 'await', 'else', 'do']);

      for (let i = start; i < code.length;) {
        const c = code[i];
        const n = code[i + 1] || '';

        if (!quote && !lineComment && !blockComment && /^<\/script\s*>/i.test(code.slice(i))) {
          const match = code.slice(i).match(/^<\/script\s*>/i);
          return { index: i, end: i + match[0].length };
        }

        if (lineComment) {
          if (c === '\n' || c === '\r') lineComment = false;
          i++;
          continue;
        }
        if (blockComment) {
          if (c === '*' && n === '/') { blockComment = false; i += 2; }
          else i++;
          continue;
        }
        if (quote) {
          if (c === '\\') i += Math.min(2, code.length - i);
          else { if (c === quote) quote = null; i++; }
          continue;
        }
        if (c === '"' || c === "'" || c === '`') { quote = c; i++; continue; }
        if (c === '/' && n === '/' ) { lineComment = true; i += 2; continue; }
        if (c === '/' && n === '*') { blockComment = true; i += 2; continue; }
        if (c === '/' && regexAllowed) {
          i++;
          let inClass = false;
          while (i < code.length) {
            const current = code[i++];
            if (current === '\\') i++;
            else if (current === '[') inClass = true;
            else if (current === ']') inClass = false;
            else if (current === '/' && !inClass) {
              while (i < code.length && /[a-z]/i.test(code[i])) i++;
              break;
            } else if (current === '\n' || current === '\r') break;
          }
          regexAllowed = false;
          previousWord = '';
          continue;
        }
        if (/[\w$]/.test(c)) {
          const startWord = i;
          while (i < code.length && /[\w$]/.test(code[i])) i++;
          previousWord = code.slice(startWord, i);
          regexAllowed = regexPrefixKeywords.has(previousWord);
          continue;
        }
        if (!/\s/.test(c)) {
          previousWord = '';
          regexAllowed = !(/[)\]}]/.test(c) || c === ',');
        }
        i++;
      }
      return null;
    }

    function minifyCode(code, lang) {
      if (!code || !code.trim()) return '';

      if (lang === 'html') {
        let clean = code.replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style\s*>)/gi, (_, open, body, close) => open + minifyCSS(body) + close);
        const scriptOpen = /<script\b(?![^>]*\bsrc\s*=)[^>]*>/gi;
        let result = '';
        let last = 0;
        let opening;

        while ((opening = scriptOpen.exec(clean))) {
          const bodyStart = scriptOpen.lastIndex;
          const closing = findScriptClose(clean, bodyStart);
          if (!closing) {
            result += clean.slice(last, bodyStart) + minifyTokens(clean.slice(bodyStart), true);
            last = clean.length;
            break;
          }
          let body = minifyTokens(clean.slice(bodyStart, closing.index), true);
          // Prevent the HTML raw-text parser from treating a literal in JS as the end tag.
          body = body.replace(/<\/script/gi, '<\\/script');
          result += clean.slice(last, bodyStart) + body + clean.slice(closing.index, closing.end);
          last = closing.end;
          scriptOpen.lastIndex = closing.end;
        }

        if (last < clean.length) result += clean.slice(last);
        return result.replace(/>\s+</g, '><').trim();
      }

      if (lang === 'css') return minifyCSS(code);
      if (['js','c','cpp','go'].includes(lang)) return minifyTokens(code, true);
      if (lang === 'python') return code.split('\n').filter(line => line.trim()).join('\n');
      return code;
    }

    function formatCode(code, lang) {
      if (!code || !code.trim()) return '';

      if (lang === 'css') {
        return code
          .replace(/\s*\{\s*/g, ' {\n  ')
          .replace(/\s*;\s*/g, ';\n  ')
          .replace(/\s*\}\s*/g, '\n}\n\n')
          .trim();
      }

      if (['js','c','cpp','go'].includes(lang)) {
        let indent = 0;
        const lines = code.split('\n');
        const result = [];

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) continue;
          if (line.startsWith('}')) indent = Math.max(0, indent - 1);
          result.push('  '.repeat(indent) + line);
          if (line.endsWith('{')) indent += 1;
        }

        return result.join('\n');
      }

      return code;
    }

    function getByteSize(s) {
      return new Blob([s || '']).size;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('inputCode');
      const output = document.getElementById('outputCode');
      const language = document.getElementById('language');
      const detected = document.getElementById('detectedLang');
      const inputStats = document.getElementById('inputStats');
      const outputStats = document.getElementById('outputStats');

      function currentLanguage() {
        if (language.value !== 'auto') {
          const label = language.options[language.selectedIndex].text;
          detected.textContent = `수동 지정: ${label}`;
          return language.value;
        }

        const result = detectLanguage(input.value);
        detected.textContent = `감지된 언어: ${result.label}`;
        return result.lang;
      }

      function updateStats() {
        const before = getByteSize(input.value);
        const after = getByteSize(output.value);
        const ratio = before ? (((before - after) / before) * 100).toFixed(1) : '0';
        outputStats.textContent = `크기: ${after} bytes (절감률: ${ratio}%)`;
      }

      input.addEventListener('input', () => {
        inputStats.textContent = `크기: ${getByteSize(input.value)} bytes`;
        currentLanguage();
      });

      language.addEventListener('change', currentLanguage);

      document.getElementById('btnOptimize').addEventListener('click', () => {
        output.value = minifyCode(input.value, currentLanguage());
        updateStats();
      });

      document.getElementById('btnFormat').addEventListener('click', () => {
        output.value = formatCode(input.value, currentLanguage());
        updateStats();
      });

      document.getElementById('btnCopy').addEventListener('click', async () => {
        if (!output.value) return;

        try {
          await navigator.clipboard.writeText(output.value);
          alert('클립보드에 복사되었습니다!');
        } catch (error) {
          output.select();
          document.execCommand('copy');
          alert('클립보드에 복사되었습니다!');
        }
      });
    });
  </script>
</body>
</html>
