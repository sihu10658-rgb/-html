
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 코드 최적화 도구</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>스마트 코드 최적화 도구</h1>
    
    <div class="controls">
        <div class="lang-status" id="detectedLang">감지된 언어: 자동 감지 중...</div>

        <select id="language">
            <option value="auto">자동 감지 (Auto Detect)</option>
            <option value="html">HTML</option>
            <option value="js">JavaScript</option>
            <option value="python">Python</option>
            <option value="css">CSS</option>
            <option value="cpp">C++</option>
        </select>

        <button id="btnOptimize">코드 압축 (Minify)</button>
        <button id="btnFormat">코드 정렬 (Pretty)</button>
        <button id="btnCopy">결과 복사</button>
    </div>

    <div class="editor-container">
        <div class="editor-box">
            <label for="inputCode">원본 코드</label>
            <textarea id="inputCode" placeholder="코드를 붙여넣으세요..."></textarea>
            <div class="stats" id="inputStats">크기: 0 bytes</div>
        </div>

        <div class="editor-box">
            <label for="outputCode">최적화된 코드</label>
            <textarea id="outputCode" readonly placeholder="결과가 여기에 표시됩니다..."></textarea>
            <div class="stats" id="outputStats">크기: 0 bytes (절감률: 0%)</div>
        </div>
    </div>
</div>

<script>
// --- 1. 최적화 엔진 (Optimizer Logic) ---
function detectLanguage(code) {
    if (!code.trim()) return { lang: 'js', label: '없음' };
    if (/<[a-z][\s\S]*>/i.test(code)) return { lang: 'html', label: 'HTML' };
    if (/#include|std::|cout/i.test(code)) return { lang: 'cpp', label: 'C++' };
    if (/def\s+\w+|import\s+\w+|print\(/i.test(code)) return { lang: 'python', label: 'Python' };
    if (/[\.#]?\w+\s*\{/i.test(code) && !/function|const|let|var/.test(code)) return { lang: 'css', label: 'CSS' };
    return { lang: 'js', label: 'JavaScript' };
}

function minifyCode(code, lang) {
    if (!code.trim()) return '';

    switch (lang) {
        case 'html':
            return code
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/>\s+</g, '><')
                .replace(/\s+/g, ' ');

        case 'css':
            return code
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s*([\{\}\:\;\,])\s*/g, '$1')
                .replace(/\s+/g, ' ');

        case 'js':
            return code
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\/\/.*/g, '')
                .replace(/\s*([\{\}\(\)\=\+\-\*\/\:\;\,\<\>])\s*/g, '$1')
                .replace(/\s+/g, ' ');

        case 'python':
            return code
                .split('\n')
                .map(line => line.replace(/#.*/, ''))
                .filter(line => line.trim() !== '')
                .join('\n');

        case 'cpp':
            return code
                .split('\n')
                .map(line => line.replace(/\/\/.*/, '').trim())
                .filter(Boolean)
                .join(' ');

        default:
            return code;
    }
}

function formatCode(code, lang) {
    if (!code.trim()) return '';

    if (lang === 'css') {
        return code
            .replace(/\s*\{\s*/g, ' {\n  ')
            .replace(/\s*;\s*/g, ';\n  ')
            .replace(/\s*\}\s*/g, '\n}\n\n');
    }

    if (lang === 'js' || lang === 'cpp') {
        let indent = 0;
        return code.split('\n').map(line => {
            let trimmed = line.trim();
            if (!trimmed) return '';
            if (trimmed.startsWith('}')) indent = Math.max(0, indent - 1);
            let indentedLine = '  '.repeat(indent) + trimmed;
            if (trimmed.endsWith('{')) indent++;
            return indentedLine;
        }).filter(Boolean).join('\n');
    }

    return code;
}

function getByteSize(str) {
    return new Blob([str]).size;
}

// --- 2. UI 바인딩 및 이벤트 처리 (App Logic) ---
document.addEventListener('DOMContentLoaded', () => {
    const inputArea = document.getElementById('inputCode');
    const outputArea = document.getElementById('outputCode');
    const langSelect = document.getElementById('language');
    const detectedLangText = document.getElementById('detectedLang');

    function getCurrentLanguage() {
        if (langSelect.value !== 'auto') {
            const selectedText = langSelect.options[langSelect.selectedIndex].text;
            detectedLangText.innerText = `수동 지정: ${selectedText}`;
            return langSelect.value;
        }

        const result = detectLanguage(inputArea.value);
        detectedLangText.innerText = `감지된 언어: ${result.label}`;
        return result.lang;
    }

    function updateStats() {
        const inSize = getByteSize(inputArea.value);
        const outSize = getByteSize(outputArea.value);
        const ratio = inSize > 0 ? (((inSize - outSize) / inSize) * 100).toFixed(1) : 0;
        document.getElementById('outputStats').innerText = `크기: ${outSize} bytes (절감률: ${ratio}%)`;
    }

    inputArea.addEventListener('input', () => {
        document.getElementById('inputStats').innerText = `크기: ${getByteSize(inputArea.value)} bytes`;
        getCurrentLanguage();
    });

    langSelect.addEventListener('change', () => {
        getCurrentLanguage();
    });

    document.getElementById('btnOptimize').addEventListener('click', () => {
        const lang = getCurrentLanguage();
        outputArea.value = minifyCode(inputArea.value, lang);
        updateStats();
    });

    document.getElementById('btnFormat').addEventListener('click', () => {
        const lang = getCurrentLanguage();
        outputArea.value = formatCode(inputArea.value, lang);
        updateStats();
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
        if (!outputArea.value) return;
        outputArea.select();
        document.execCommand('copy');
        alert('클립보드에 복사되었습니다!');
    });
});
</script>
</body>
</html>
