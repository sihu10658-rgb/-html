<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스마트 코드 최적화 도구</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Pinned browser builds: formatting/minification uses parsers, not regex rewriting. -->
    <script defer src="https://cdn.jsdelivr.net/npm/prettier@3.5.3/standalone.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prettier@3.5.3/plugins/babel.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prettier@3.5.3/plugins/estree.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prettier@3.5.3/plugins/html.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prettier@3.5.3/plugins/postcss.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/terser@5.39.0/dist/bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/csso@5.0.5/dist/csso.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>스마트 코드 최적화 도구</h1>

      <section class="controls" aria-label="코드 도구">
        <p id="detectedLang" class="lang-status" aria-live="polite">감지: JavaScript</p>
        <p id="capabilityStatus" class="lang-status" aria-live="polite"></p>
        <label for="language">언어</label>
        <select id="language">
          <option value="auto">자동 감지</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="js">JavaScript</option>
          <option value="python">Python</option>
          <option value="c">C</option>
          <option value="cpp">C++</option>
          <option value="go">Go</option>
        </select>
        <button id="btnOptimize" type="button">최적화</button>
        <button id="btnFormat" type="button">정렬</button>
        <button id="btnCopy" type="button">복사</button>
      </section>

      <section class="editor-container" aria-label="코드 편집기">
        <div class="editor-box">
          <label for="inputCode">입력 코드</label>
          <textarea id="inputCode" spellcheck="false" placeholder="여기에 코드를 입력하세요..."></textarea>
          <div id="inputStats" class="stats">입력 크기: 0 bytes</div>
        </div>
        <div class="editor-box">
          <label for="outputCode">결과 코드</label>
          <textarea id="outputCode" spellcheck="false" readonly placeholder="최적화 또는 정렬 결과가 여기에 표시됩니다..."></textarea>
          <div id="outputStats" class="stats">결과 크기: 0 bytes (절감률: 0%)</div>
        </div>
      </section>
    </main>
  </body>
</html>
