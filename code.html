<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 코드 최적화 도구</title>
  <style>
    :root { --bg-color:#1e1e2e; --card-bg:#2b2b3b; --text-color:#cdd6f4; --sub-text:#a6adc8; --primary-color:#89b4fa; --border-color:#45475a; --accent-color:#a6e3a1; }
    body { font-family:Consolas,"Courier New",monospace; background:var(--bg-color); color:var(--text-color); margin:0; padding:20px; }
    .container { max-width:1200px; margin:0 auto; background:var(--card-bg); padding:25px; border-radius:10px; box-shadow:0 4px 20px #0005; }
    h1 { margin-top:0; text-align:center; color:var(--primary-color); }
    .controls { display:flex; gap:15px; margin-bottom:20px; align-items:center; justify-content:center; flex-wrap:wrap; }
    .lang-status { font-size:13px; color:var(--accent-color); font-weight:bold; padding:8px 12px; background:#181825; border-radius:6px; border:1px solid var(--border-color); }
    select,button { padding:10px 16px; font-size:14px; border-radius:6px; border:1px solid var(--border-color); background:#313244; color:var(--text-color); cursor:pointer; }
    button { background:var(--primary-color); color:#11111b; font-weight:bold; border:0; }
    .editor-container { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:768px) { .editor-container { grid-template-columns:1fr; } }
    .editor-box { display:flex; flex-direction:column; }
    label { font-weight:bold; margin-bottom:8px; color:var(--sub-text); }
    textarea { width:100%; height:450px; padding:12px; font:13px inherit; font-family:inherit; border:1px solid var(--border-color); border-radius:6px; resize:vertical; box-sizing:border-box; background:#181825; color:var(--text-color); }
    textarea:focus { border-color:var(--primary-color); outline:none; }
    .stats { margin-top:10px; font-size:13px; color:var(--sub-text); }
  </style>
</head>
<body>
  <div class="container">
    <h1>스마트 코드 최적화 도구</h1>
    <div class="controls">
      <div class="lang-status" id="detectedLang">감지된 언어: 자동 감지 중...</div>
      <select id="language">
        <option value="auto">자동 감지 (Auto Detect)</option>
        <option value="html">HTML</option><option value="css">CSS</option>
        <option value="js">JavaScript</option><option value="python">Python</option>
        <option value="c">C</option><option value="cpp">C++</option><option value="go">Go</option>
      </select>
      <button id="btnOptimize" type="button">코드 압축 (Minify)</button>
      <button id="btnFormat" type="button">코드 정렬 (Pretty)</button>
      <button id="btnCopy" type="button">결과 복사</button>
    </div>
    <div class="editor-container">
      <div class="editor-box"><label for="inputCode">입력 코드</label><textarea id="inputCode" placeholder="최적화할 코드를 입력하세요..."></textarea><div class="stats" id="inputStats">크기: 0 bytes</div></div>
      <div class="editor-box"><label for="outputCode">최적화된 코드</label><textarea id="outputCode" readonly placeholder="결과가 여기에 표시됩니다..."></textarea><div class="stats" id="outputStats">크기: 0 bytes (절감률: 0%)</div></div>
    </div>
  </div>
<script>
  function detectLanguage(code) {
    if (!code || !code.trim()) return { lang:'js', label:'없음' };
    if (/<[a-z][\s\S]*>/i.test(code)) return { lang:'html', label:'HTML' };
    if (/^\s*#\s*include\b|\bstd::|\bcout\s*<</m.test(code)) return { lang:'cpp', label:'C++' };
    if (/\bpackage\s+main\b|\bfunc\s+(?:main|\w+)\s*\(|\bfmt\.Print/i.test(code)) return { lang:'go', label:'Go' };
    if (/^\s*#\s*include\s*[<"]|\bint\s+main\s*\(|\bprintf\s*\(/m.test(code)) return { lang:'c', label:'C' };
    if (/\bdef\s+\w+|\bimport\s+\w+|\bprint\s*\(/.test(code)) return { lang:'python', label:'Python' };
    if (/[.#]?\w+\s*\{/.test(code) && !/function|const|let|var/.test(code)) return { lang:'css', label:'CSS' };
    return { lang:'js', label:'JavaScript' };
  }

  // Remove C-style comments without treating comment markers inside quoted strings as comments.
  function removeCStyleComments(code) {
    let out = '', quote = null, lineComment = false, blockComment = false;
    for (let i = 0; i < code.length; i++) {
      const c = code[i], next = code[i + 1] || '';
      if (lineComment) { if (c === '\n') { lineComment = false; out += c; } continue; }
      if (blockComment) { if (c === '*' && next === '/') { blockComment = false; i++; } else if (c === '\n') out += '\n'; continue; }
      if (quote) {
        out += c;
        if (c === '\\' && i + 1 < code.length) out += code[++i];
        else if (c === quote) quote = null;
        continue;
      }
      if (c === '"' || c === "'" || c === '`') { quote = c; out += c; continue; }
      if (c === '/' && next === '/') { lineComment = true; i++; continue; }
      if (c === '/' && next === '*') { blockComment = true; i++; continue; }
      out += c;
    }
    return out;
  }

  function minifyCode(code, lang) {
    if (!code || !code.trim()) return '';
    if (lang === 'html') {
      let clean = code.replace(/<!--([\s\S]*?)-->/g, '');
      clean = clean.replace(/(<style[^>]*>)([\s\S]*?)(<\/style>)/gi, (_, open, body, close) => open + minifyCode(body, 'css') + close);
      clean = clean.replace(/(<script(?![^>]*\bsrc\s*=)[^>]*>)([\s\S]*?)(<\/script>)/gi, (_, open, body, close) => open + minifyCode(body, 'js') + close);
      return clean.replace(/>\s+</g, '><').trim();
    }
    if (lang === 'css') {
      return removeCStyleComments(code).replace(/\s*([{}:;,])\s*/g, '$1').replace(/[\t\r\n ]+/g, ' ').trim();
    }
    if (lang === 'js') {
      // Conservative mode: remove comments but preserve token spacing to avoid changing program behavior.
      return removeCStyleComments(code).split('\n').map(line => line.trim()).filter(Boolean).join('\n');
    }
    if (lang === 'c' || lang === 'cpp' || lang === 'go') {
      // Keep line breaks and token spacing; aggressive regex minification can change C/Go semantics.
      return removeCStyleComments(code).split('\n').map(line => line.trim()).filter(Boolean).join('\n');
    }
    if (lang === 'python') {
      // Python indentation is significant, so only discard blank lines.
      return code.split('\n').filter(line => line.trim()).join('\n');
    }
    return code;
  }

  function formatCode(code, lang) {
    if (!code || !code.trim()) return '';
    if (lang === 'css') return code.replace(/\s*\{\s*/g, ' {\n  ').replace(/\s*;\s*/g, ';\n  ').replace(/\s*\}\s*/g, '\n}\n\n').trim();
    if (['js', 'c', 'cpp', 'go'].includes(lang)) {
      let indent = 0;
      return code.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('}')) indent = Math.max(0, indent - 1);
        const result = '  '.repeat(indent) + trimmed;
        if (trimmed.endsWith('{')) indent++;
        return result;
      }).filter(Boolean).join('\n');
    }
    return code;
  }

  function getByteSize(value) { return new Blob([value || '']).size; }
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('inputCode'), output = document.getElementById('outputCode');
    const language = document.getElementById('language'), detected = document.getElementById('detectedLang');
    const inputStats = document.getElementById('inputStats'), outputStats = document.getElementById('outputStats');
    function currentLanguage() {
      if (language.value !== 'auto') {
        const label = language.options[language.selectedIndex].text;
        detected.innerText = `수동 지정: ${label}`;
        return language.value;
      }
      const result = detectLanguage(input.value);
      detected.innerText = `감지된 언어: ${result.label}`;
      return result.lang;
    }
    function updateStats() {
      const inputSize = getByteSize(input.value), outputSize = getByteSize(output.value);
      const ratio = inputSize ? (((inputSize - outputSize) / inputSize) * 100).toFixed(1) : '0';
      outputStats.innerText = `크기: ${outputSize} bytes (절감률: ${ratio}%)`;
    }
    input.addEventListener('input', () => {
      inputStats.innerText = `크기: ${getByteSize(input.value)} bytes`;
      currentLanguage();
    });
    language.addEventListener('change', currentLanguage);
    document.getElementById('btnOptimize').addEventListener('click', () => {
      output.value = minifyCode(input.value, currentLanguage());
      updateStats();
    });
    document.getElementById('btnFormat').addEventListener('click', () => {
      output.value = formatCode(input.value, currentLanguage());
      updateStats();
    });
    document.getElementById('btnCopy').addEventListener('click', async () => {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
        alert('클립보드에 복사되었습니다!');
      } catch (error) {
        output.select();
        document.execCommand('copy');
        alert('클립보드에 복사되었습니다!');
      }
    });
  });
</script>
</body>
</html>
