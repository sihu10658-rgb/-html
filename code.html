<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>스마트 코드 최적화 도구</title><style>:root{--bg-color:#1e1e2e;--card-bg:#2b2b3b;--text-color:#cdd6f4;--sub-text:#a6adc8;--primary-color:#89b4fa;--border-color:#45475a;--accent-color:#a6e3a1}body{font-family:Consolas,"Courier New",monospace;background:var(--bg-color);color:var(--text-color);margin:0;padding:20px}.container{max-width:1200px;margin:0 auto;background:var(--card-bg);padding:25px;border-radius:10px;box-shadow:0 4px 20px #0005}h1{margin-top:0;text-align:center;color:var(--primary-color)}.controls{display:flex;gap:15px;margin-bottom:20px;align-items:center;justify-content:center;flex-wrap:wrap}.lang-status{font-size:13px;color:var(--accent-color);font-weight:bold;padding:8px 12px;background:#181825;border-radius:6px;border:1px solid var(--border-color)}select,button{padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid var(--border-color);background:#313244;color:var(--text-color);cursor:pointer}button{background:var(--primary-color);color:#11111b;font-weight:bold;border:0}.editor-container{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:768px){.editor-container{grid-template-columns:1fr}}.editor-box{display:flex;flex-direction:column}label{font-weight:bold;margin-bottom:8px;color:var(--sub-text)}textarea{width:100%;height:450px;padding:12px;font-family:inherit;font-size:13px;border:1px solid var(--border-color);border-radius:6px;resize:vertical;box-sizing:border-box;background:#181825;color:var(--text-color)}textarea:focus{border-color:var(--primary-color);outline:none}.stats{margin-top:10px;font-size:13px;color:var(--sub-text)}</style></head><body><div class="container"><h1>스마트 코드 최적화 도구</h1><div class="controls"><div class="lang-status" id="detectedLang">감지된 언어: 자동 감지 중...</div><select id="language"><option value="auto">자동 감지 (Auto Detect)</option><option value="html">HTML</option><option value="css">CSS</option><option value="js">JavaScript</option><option value="python">Python</option><option value="c">C</option><option value="cpp">C++</option><option value="go">Go</option></select><button id="btnOptimize" type="button">극한 압축 (Minify)</button><button id="btnFormat" type="button">코드 정렬 (Pretty)</button><button id="btnCopy" type="button">결과 복사</button></div><div class="editor-container"><div class="editor-box"><label for="inputCode">입력 코드</label><textarea id="inputCode" placeholder="최적화할 코드를 입력하세요..."></textarea><div class="stats" id="inputStats">크기: 0 bytes</div></div><div class="editor-box"><label for="outputCode">최적화된 코드</label><textarea id="outputCode" readonly placeholder="결과가 여기에 표시됩니다..."></textarea><div class="stats" id="outputStats">크기: 0 bytes (절감률: 0%)</div></div></div></div><script>function detectLanguage(code){if(!code||!code.trim())return{lang:'js',label:'없음'};if(/<[a-z][\s\S]*>/i.test(code))return{lang:'html',label:'HTML'};if(/^\s*#\s*include\b|\bstd::|\bcout\s*<</m.test(code))return{lang:'cpp',label:'C++'};if(/\bpackage\s+main\b|\bfunc\s+(?:main|\w+)\s*\(|\bfmt\.Print/i.test(code))return{lang:'go',label:'Go'};if(/^\s*#\s*include\s*[<"]|\bint\s+main\s*\(|\bprintf\s*\(/m.test(code)) return {lang:'c',label:'C'};
    if (/\bdef\s+\w+|\bimport\s+\w+|\bprint\s*\(/.test(code)) return {lang:'python',label:'Python'};
    if (/[.#]?\w+\s*\{/.test(code) && !/function|const|let|var/.test(code)) return {lang:'css',label:'CSS'};
    return {lang:'js',label:'JavaScript'};
  }

  // Strip C-style comments while preserving quoted text and newlines.
  function stripCComments(code, lineComments=true) {
    let out='', quote=null, line=false, block=false;
    for (let i=0;i<code.length;i++) {
      const c=code[i], n=code[i+1]||'';
      if (line) { if (c==='\n') {line=false;out+='\n';} continue; }
      if (block) { if (c==='*'&&n==='/') {block=false;i++;} else if (c==='\n') out+='\n'; continue; }
      if (quote) { out+=c; if (c==='\\'&&i+1<code.length) out+=code[++i]; else if (c===quote) quote=null; continue; }
      if (c==='"'||c==="'"||c==='`') {quote=c;out+=c;continue;}
      if (lineComments&&c==='/'&&n==='/') {line=true;i++;continue;}
      if (c==='/'&&n==='*') {block=true;i++;continue;}
      out+=c;
    }
    return out;
  }
